groups:
  - name: dev-environment-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is unreachable"
          description: "Instance {{ $labels.instance }} (job: {{ $labels.job }}) has been down for more than 30 seconds."
