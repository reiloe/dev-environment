services:
  # ==========================================
  # Core Management UI (Startet immer mit)
  # ==========================================
  portainer:
    image: portainer/portainer-ce:lts
    container_name: dev-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
      - "${PORTAINER_HTTP_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - dev-net

  jenkins:
    build:
      context: ./jenkins
    container_name: dev-jenkins
    profiles: ["jenkins"]
    user: root
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8085}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dev-net

  sonarqube:
    image: sonarqube:community
    container_name: dev-sonarqube
    profiles: ["sonarqube"]
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - dev-net

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - dev-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: dev-redisinsight
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "${REDIS_UI_PORT:-8083}:5540"
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: "Dev Redis"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - dev-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dev-mosquitto
    profiles: ["mosquitto"]
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
      - "${MOSQUITTO_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - dev-net

  mqttx-web:
    image: emqx/mqttx-web:latest
    container_name: dev-mqttx-web
    profiles: ["mosquitto"]
    restart: unless-stopped
    ports:
      - "${MQTTX_PORT:-8084}:80"
    depends_on:
      - mosquitto
    networks:
      - dev-net

  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dev-pgadmin
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8092}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secretpassword}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - dev-net

  mongodb:
    image: mongo:7
    container_name: dev-mongodb
    profiles: ["mongodb"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secretpassword}
    volumes:
      - mongodb_data:/data/db
    networks:
      - dev-net

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: dev-mongo-express
    profiles: ["mongodb"]
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-secretpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-secretpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-secretpassword}
    depends_on:
      - mongodb
    networks:
      - dev-net

  mariadb:
    image: mariadb:11-noble
    container_name: dev-mariadb
    profiles: ["mariadb"]
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-secretpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-appdb}
      MARIADB_USER: ${MARIADB_USER:-appuser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-secretpassword}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dev-net

  adminer:
    image: adminer:latest
    container_name: dev-adminer
    profiles: ["mariadb"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      - mariadb
    networks:
      - dev-net

  prometheus:
    image: prom/prometheus:latest
    container_name: dev-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - dev-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: dev-alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - dev-net

  grafana:
    image: grafana/grafana:latest
    container_name: dev-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-secretpassword}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - dev-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: dev-mailpit
    profiles: ["mailpit", "monitoring"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP Server
      - "${MAILPIT_UI_PORT:-8025}:8025" # Webmail UI
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    networks:
      - dev-net

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: dev-seaweedfs
    profiles: ["seaweedfs"]
    restart: unless-stopped
    ports:
      - "${S3_API_PORT:-9002}:8333" # S3 API
      - "${S3_UI_PORT:-9003}:9333" # Master / Cluster Web UI
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - dev-net

  localstack:
    image: localstack/localstack:latest
    container_name: dev-localstack
    profiles: ["localstack"]
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3,sqs,sns,secretsmanager,dynamodb
      DEBUG: 0
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dev-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: dev-keycloak
    profiles: ["keycloak"]
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8086}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-secretpassword}
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - dev-net

  nexus:
    image: sonatype/nexus3:latest
    container_name: dev-nexus
    profiles: ["nexus"]
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8087}:8081"
      - "${NEXUS_DOCKER_PORT:-8088}:8088" # Optional for hosted Docker Registry
    volumes:
      - nexus_data:/nexus-data
    networks:
      - dev-net

  vault:
    image: hashicorp/vault:latest
    container_name: dev-vault
    profiles: ["vault"]
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - dev-net

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: dev-zap
    profiles: ["zap"]
    restart: unless-stopped
    ports:
      - "${ZAP_PORT:-8090}:8090"
    command: zap-webswing.sh
    networks:
      - dev-net

  registry:
    image: registry:2
    container_name: dev-registry
    profiles: ["registry"]
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "[http://localhost:8091]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "[HEAD,GET,OPTIONS,DELETE]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "[Authorization,Accept,Cache-Control]"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "[Docker-Content-Digest]"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - dev-net

  registry-ui:
    image: joxit/docker-registry-ui:main
    container_name: dev-registry-ui
    profiles: ["registry"]
    restart: unless-stopped
    ports:
      - "${REGISTRY_UI_PORT:-8091}:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Dev Environment Private Registry"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_MIN_BRANCHES: 1
      CATALOG_MAX_BRANCHES: 1
      TAGLIST_PAGE_SIZE: 100
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: 1000
    depends_on:
      - registry
    networks:
      - dev-net

volumes:
  portainer_data:
  redis_data:
  redisinsight_data:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  pgadmin_data:
  mongodb_data:
  mariadb_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mailpit_data:
  seaweedfs_data:
  localstack_data:
  keycloak_data:
  nexus_data:
  registry_data:

networks:
  dev-net:
    driver: bridge
