global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "mailpit-receiver"

receivers:
  - name: "mailpit-receiver"
    email_configs:
      - to: "alerts@dev-environment.local"
        from: "alertmanager@dev-environment.local"
        smarthost: "mailpit:1025"
        require_tls: false
        send_resolved: true
